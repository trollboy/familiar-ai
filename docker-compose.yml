services:
  app:
    build:
      context: .
      target: runtime
    volumes:
      - familiar-ai-data:/data
      - familiar-ai-config:/config
    environment:
      - FAMILIAR_AI_LOGGING__LEVEL=info
      - FAMILIAR_AI_LOGGING__FORMAT=json

  test:
    build:
      context: .
      target: tester
    working_dir: /app
    command: >
      cargo llvm-cov test --workspace --no-fail-fast --no-default-features
    volumes:
      - cargo-cache:/usr/local/cargo/registry

volumes:
  familiar-ai-data:
  familiar-ai-config:
  cargo-cache:
