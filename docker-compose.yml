services:
  app:
    build:
      context: .
      target: runtime
    volumes:
      - familiar-ai-data:/data
      - familiar-ai-config:/config
    environment:
      - FAMILIAR_AI_LOGGING__LEVEL=info
      - FAMILIAR_AI_LOGGING__FORMAT=json

  test:
    build:
      context: .
      target: tester
    working_dir: /app
    # PRD-099: the compose service declares no steps of its own. It runs the
    # single definition, which is the same thing CI and a contributor run.
    command: scripts/gate.sh
    volumes:
      - cargo-cache:/usr/local/cargo/registry

volumes:
  familiar-ai-data:
  familiar-ai-config:
  cargo-cache:
