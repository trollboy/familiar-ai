services:
  app:
    build:
      context: .
      target: runtime
    volumes:
      - familiar-ai-data:/data
      - familiar-ai-config:/config
    environment:
      - FAMILIAR_AI_LOGGING__LEVEL=info
      - FAMILIAR_AI_LOGGING__FORMAT=json

  test:
    build:
      context: .
      target: tester
    working_dir: /app
    # Mount-namespace creation for the bubblewrap review-isolation tests
    # (PRD-016). Test container only; production isolation depends solely on
    # the host's own bubblewrap.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    command: >
      cargo llvm-cov test --workspace --no-fail-fast --no-default-features
    volumes:
      - cargo-cache:/usr/local/cargo/registry

volumes:
  familiar-ai-data:
  familiar-ai-config:
  cargo-cache:
