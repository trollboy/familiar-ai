[workspace]
resolver = "2"
members = [
    "crates/familiar-ai-agent",
    "crates/familiar-ai-review",
    "crates/familiar-ai-context",
    "crates/familiar-ai-compress",
    "crates/familiar-ai-core",
    "crates/familiar-ai-logging",
    "crates/familiar-ai-mcp",
    "crates/familiar-ai-storage",
    "crates/familiar-ai-summary",
    "crates/familiar-ai-tokens",
    "crates/familiar-ai-llm",
    "crates/familiar-ai-watcher",
    "crates/familiar-ai-testutil",
    "crates/familiar-ai-daemon",
]
exclude = [
    "crates/familiar-ai-tray",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
libc = "0.2"
tempfile = "3"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
notify-debouncer-mini = "0.5"
ignore = "0.4"
tray-icon = "0.22"
muda = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
opener = "0.7"
async-trait = "0.1"
regex = "1"
once_cell = "1"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
wiremock = "0.6"
axum = "0.8"
landlock = "0.4"
wait-timeout = "0.2"
