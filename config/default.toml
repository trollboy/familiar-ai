# Familiar Daemon Configuration
#
# This is the default configuration file. Copy to:
#   Linux:  ~/.config/familiar-ai/config.toml
#   macOS:  ~/Library/Application Support/Familiar-AI/config.toml
#
# All values shown are defaults. Uncomment and modify as needed.
# Environment variables override file values (prefix: FAMILIAR_AI_, separator: __)
# Example: FAMILIAR_AI_DAEMON__HEARTBEAT_INTERVAL_SECS=30

[daemon]
# heartbeat_interval_secs = 60
# pid_file = ""         # Default: platform-specific (see AppPaths)
# socket_path = ""      # Default: platform-specific (see AppPaths)

[logging]
# level = "info"        # Options: trace, debug, info, warn, error
# format = "pretty"     # Options: pretty, json
# file = ""             # Optional: path to log file (logs also go to stdout)

[database]
# path = ""             # Default: <data_dir>/familiar.db

[execution_context]
# hard_ceiling_tokens = 12000  # Optional; disabled when absent

# Unattended driver warrant. `familiar-ai drive` refuses to start unless at
# least one ceiling below is finite — an unbounded unattended loop is not a
# warrant. Command-line flags may only tighten these values, never loosen them.
# Note: cost ceilings require *known* per-run cost, which comes from
# [execution_history.pricing]; without pricing configured every run's cost is
# unknown and a cost ceiling ends the session after the first attempt
# (unknown is never treated as zero).
[driver]
max_prds_per_session = 0      # 0 = unlimited
max_session_cost_microusd = 0 # 0 = no cost ceiling
max_session_duration_ms = 0   # 0 = no duration ceiling

[review]
enabled = false
max_review_attempts = 3
max_remediation_attempts = 2
max_total_tokens = 0
max_total_cost_microusd = 0
max_total_duration_ms = 0
allow_isolated_same_model_fallback = false
max_package_bytes = 1000000
max_package_tokens = 250000
max_evidence_bytes = 16000000
max_verification_log_bytes = 256000
# allowed_paths = ["src/", "tests/"]
# Prohibited changes are typed rules with stable ids. Each rule names exactly
# one of `path` (closed grammar: exact file, `dir/`, or `dir/**`) or `class`
# (dependency_manifest | dependency_lockfile | migration | configuration |
# test | generated_artifact). Optional `change_kinds` restricts the rule to
# specific Git change kinds; empty means all. The only accepted legacy string
# forms are a repository-relative path containing '/' or '.', or the exact
# phrase "dependency changes".
# [[review.prohibited_changes]]
# id = "no_secret_changes"
# path = "secrets/"
# description = "secret material is never agent-editable"
# [[review.prohibited_changes]]
# id = "no_dependency_manifest_changes"
# class = "dependency_manifest"

# Deterministic coding-agent selection. When this section is absent both the
# implementation and reviewer agents resolve to the Codex adapter with
# executable "codex" — exactly the historical behavior — and no review
# consistency checking applies. When present, validation is fail-closed and,
# with review enabled, review.*_agent.adapter_id must equal agents.*.adapter.
# [agents.implementation]
# adapter = "claude-code"          # "codex" | "claude-code"; default "codex"
# executable = "claude"            # default: "codex" for codex, "claude" for claude-code
# model = "sonnet"                 # optional; omitted -> CLI default
# effort = "high"                  # optional; claude-code only: "low" | "medium" | "high"
# permission_mode = "acceptEdits"  # optional; claude-code only:
#                                  # "default" | "plan" | "acceptEdits" | "bypassPermissions"
# max_budget_microusd = 0          # optional; 0/absent -> no adapter budget ceiling
# extra_args = []                  # optional; validated passthrough
# [agents.reviewer]
# adapter = "claude-code"
# executable = "claude"
# model = "sonnet"
# effort = "high"
# permission_mode = "default"      # bypassPermissions is always rejected here

[review.scope]
allow_prd_expected_file_expansion = false
declaration_mode = "expected_or_configured"
# [[review.scope.classification]]
# id = "storage_migrations"
# class = "migration"
# path = "crates/familiar-ai-storage/migrations/"

[review.scope.file_classes]
dependency_manifest = "human_review"
dependency_lockfile = "human_review"
migration = "human_review"
configuration = "human_review"
test = "allow_when_expected"
generated_artifact = "human_review"
# [[review.verification]]
# check_id = "tests"
# argv = ["cargo", "test"]
# working_directory = "."
# timeout_ms = 300000
# required = true
# path_prefixes = ["crates/"]
# environment = { PATH = "/usr/local/bin:/usr/bin:/bin" }
# [review.implementation_agent]
# adapter_id = "codex-cli"
# agent_id = "implementation"
# provider = "openai"
# model = "configured-model"
# [review.reviewer_agent]
# adapter_id = "codex-cli"
# agent_id = "reviewer"
# provider = "openai"
# model = "configured-model"

[watcher]
# enabled = true
# paths = []                                    # Directories to watch (e.g. ["~/Projects"])
# debounce_ms = 1000
# ignore_patterns = ["target/**", "node_modules/**"]
# respect_gitignore = true

[tray]
# enabled = true
# recent_projects_count = 5

[summary]
# enabled = true
# staleness_threshold_secs = 86400      # forced refresh window (24h)
# flush_interval_secs = 3
# max_file_size_bytes = 1048576         # 1 MB
# max_pending_files = 10000
# per_file_quiet_ms = 1500              # debounce per path before regen

[rollup]
# enabled = true
# default_limit = 20
# max_rollup_tokens = 4000
# max_rollup_chars = 50000

[dashboard]
# enabled = false                     # opt-in: set true to start localhost dashboard
# bind_address = "127.0.0.1:9400"

[packer]
# default_profile = "balanced"        # Options: minimal, balanced, aggressive, max_accuracy
# hard_ceiling_tokens = 15000

[inference.text]
# mode = "disabled"             # Options: disabled, local_only, remote_only, hybrid
# provider = "disabled"         # Options: disabled, builtin, remote
# builtin_model = "qwen2.5:3b"
# builtin_url = "http://127.0.0.1:11434/v1"
# remote_url = ""
# remote_api_key = ""
# fallback_enabled = true
# prefer_privacy = false
# prefer_cost_savings = true
# max_input_chars = 16000
# max_concurrent_requests = 4
# request_timeout_secs = 60

[inference.embedding]
# provider = "disabled"         # Options: disabled, builtin, remote
# builtin_model = "nomic-embed-text"
# builtin_url = "http://127.0.0.1:11434/v1"
# remote_url = ""
# remote_api_key = ""
# fallback_enabled = true
# max_concurrent_requests = 4
# request_timeout_secs = 60

# ---------------------------------------------------------------------------
# Repository backlog profiles (PRD-025)
#
# Familiar drives repositories whose backlog does not follow the canonical
# `docs/prds/PRD-<n>.md` convention. The grammar is a *profile*: a closed, named
# parser chosen here, by you, per repository. It is never inferred, never
# user-defined, and never read from the target repository — a repository cannot
# choose how it is parsed.
#
# A repository with no entry below resolves to `canonical` at the canonical
# locations, which is exactly the behavior you have today. Nothing needs to be
# declared for Familiar's own repository.
#
# Keys are absolute worktree paths, so these belong in *your* config file
# (see the copy targets at the top of this file), not in this shared default.
#
# Shipped profiles:
#   canonical     docs/prds/PRD-<digits>.md, "# PRD-<digits>: <title>",
#                 dependencies declared with "**Depends on:**"
#   numbered-slug <digits><suffix?>-<slug>.md, "# PRD <identity> — <title>",
#                 no dependencies at all; eligibility is identity order, with
#                 epic children (0139a, 0139b) ordered before their umbrella
#                 (0139) and both before the next number (0140)
#
# reference_roots are read-only context data. Declaring one grants no execution
# authority. Omit them to keep the canonical docs/adr/, docs/contracts/, and
# docs/supporting/ roots.
#
# [repositories."/home/you/Projects/spectra"]
# profile = "numbered-slug"
# active_dir = "docs/prd/todo"
# archived_dir = "docs/prd/done"
# reference_roots = [
#   { prefix = "docs/prd/", kind = "prd" },
#   { prefix = "docs/runbooks/", kind = "supporting" },
# ]
