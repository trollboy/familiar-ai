# Familiar Daemon Configuration
#
# This is the default configuration file. Copy to:
#   Linux:  ~/.config/familiar-ai/config.toml
#   macOS:  ~/Library/Application Support/Familiar-AI/config.toml
#
# All values shown are defaults. Uncomment and modify as needed.
# Environment variables override file values (prefix: FAMILIAR_AI_, separator: __)
# Example: FAMILIAR_AI_DAEMON__HEARTBEAT_INTERVAL_SECS=30

[daemon]
# heartbeat_interval_secs = 60
# pid_file = ""         # Default: platform-specific (see AppPaths)
# socket_path = ""      # Default: platform-specific (see AppPaths)

[logging]
# level = "info"        # Options: trace, debug, info, warn, error
# format = "pretty"     # Options: pretty, json
# file = ""             # Optional: path to log file (logs also go to stdout)

[database]
# path = ""             # Default: <data_dir>/familiar.db

# Externally managed Unsloth Studio endpoint. The credential value remains in
# the environment; Familiar persists only this descriptor and probes
# authenticated OpenAI-compatible /v1/models before accepting the provider.
# [providers.unsloth-local]
# kind = "inference"
# runtime = "unsloth"
# host = "127.0.0.1:8888"
# auth = "env: UNSLOTH_API_KEY"

[execution_context]
# hard_ceiling_tokens = 12000  # Optional; disabled when absent
# prompt_cache_enabled = true   # Codex receives a stable-prefix cache key;
#                               # unsupported adapters receive no cache flag

# Planner is opt-in. Its agent fields use the same closed validation as an
# [agents] entry; the two positive ceilings bound every generated batch.
# [planner]
# adapter = "codex"
# model = "gpt-5"
# max_prds_per_batch = 8
# max_bytes_per_prd = 65536

# Repositories absent from this table use the canonical profile at docs/prds
# and docs/prds/done with the existing ADR, contract, and supporting roots.
# [repositories."/absolute/path/to/worktree"]
# profile = "numbered-slug" # "canonical" | "numbered-slug"
# active_dir = "docs/prd/todo"
# archived_dir = "docs/prd/done"
# reference_roots = [
#   { prefix = "docs/prd/", kind = "prd" },
#   { prefix = "docs/runbooks/", kind = "supporting" },
# ]
#
# Execution policy is resolved wholesale per section. This worked example
# gives a second repository its own context ceiling, scope, and verification
# pipeline; omitted sections fall back whole to their global counterpart.
# [repositories."/home/operator/Projects/spectra".execution_context]
# hard_ceiling_tokens = 60000
# [repositories."/home/operator/Projects/spectra".review]
# enabled = true
# max_review_attempts = 3
# max_remediation_attempts = 2
# max_total_duration_ms = 1200000
# allowed_paths = ["internal/", "api/", "tests/", "docs/prd/"]
# [repositories."/home/operator/Projects/spectra".review.scope]
# declaration_mode = "expected_or_configured"
# [repositories."/home/operator/Projects/spectra".review.scope.file_classes]
# dependency_manifest = "human_review"
# dependency_lockfile = "human_review"
# migration = "human_review"
# configuration = "human_review"
# test = "allow_when_expected"
# generated_artifact = "human_review"
# [[repositories."/home/operator/Projects/spectra".review.verification]]
# check_id = "lint"
# argv = ["/usr/bin/docker", "compose", "run", "--rm", "tools", "make", "lint"]
# working_directory = "."
# timeout_ms = 1200000
# required = true
# environment = { PATH = "/usr/local/bin:/usr/bin:/bin" }
# [repositories."/home/operator/Projects/spectra".review.implementation_agent]
# adapter_id = "codex"
# agent_id = "implementation"
# [repositories."/home/operator/Projects/spectra".review.reviewer_agent]
# adapter_id = "codex"
# agent_id = "reviewer"

# Unattended driver warrant. `familiar-ai drive` refuses to start unless at
# least one ceiling below is finite — an unbounded unattended loop is not a
# warrant. Command-line flags may only tighten these values, never loosen them.
# Note: cost ceilings require *known* per-run cost, which comes from
# [execution_history.pricing]; without pricing configured every run's cost is
# unknown and a cost ceiling ends the session after the first attempt
# (unknown is never treated as zero).
# Optional versioned schedules live at
# [execution_history.price_schedules."schedule-id"] and declare effective_at,
# currency = "USD", calculation_version, and per-model nanoUSD rates. Operator
# subscription declarations are separate availability/fee facts under
# [execution_history.subscriptions."provider/model"] and never imply spend.
[driver]
max_prds_per_session = 0      # 0 = unlimited
max_session_cost_microusd = 0 # 0 = no cost ceiling
max_session_tokens = 0        # 0 = no cumulative token ceiling
max_session_duration_ms = 0   # 0 = no duration ceiling
max_concurrency = 1
isolated_worktrees = false
max_parallel_components = 1 # 1 = original serial behavior; >1 schedules dependency components
worktree_root = ""           # empty = driver-owned directory under the state directory

# Delivery authority is repository-owned. Add a
# [repositories."/absolute/canonical/worktree".delivery] section for each
# repository that Familiar may publish. `mode` is one of `disabled`,
# `reviewed_pr_manual` (the safe default when a section omits it),
# `poc_self_approval`, or `review_gated_automatic`. A missing repository
# delivery section grants no publish, merge, or deploy authority.
# provider_argv = ["provider-cli"]
# max_deliveries_per_session = 1
# command_timeout_ms = 1800000
# remote = "configured-remote"
# base = "configured-base"
# staging_environment = "configured-non-production-environment"
# deploy_argv = ["deployment-adapter", "deploy"]
# smoke_argv = ["deployment-adapter", "health"]
# rollback_argv = ["deployment-adapter", "rollback"]
# migration_gate_argv = ["deployment-adapter", "migration-gate"]
# required_checks = ["configured-check"]
# credential_references = ["DELIVERY_CREDENTIAL_REFERENCE"]
# PoC mode additionally requires [repositories."...".delivery.poc_warrant]
# with actor, finite max_prds, RFC3339 expires_at, and the fixed visible
# assurance_label = "LOW_ASSURANCE_POC_SELF_APPROVAL". Governed automatic mode
# requires [repositories."...".delivery.review_gate] with three distinct
# implementer, reviewer, and approver identities. These fields model evidence;
# they do not claim certification.

# Persistent worker supervision (launchd on macOS, systemd user service on Linux).
# The generated definition preserves PATH, writes durable logs, restarts only
# after failure, and runs one finite warrant at a time.
[worker]
label = "ai.familiar.worker"
restart_throttle_secs = 10
max_prds_per_run = 1

# Commands run as exact argv before any PRD claim; no shell is involved.
# [[preflight.commands]]
# check_id = "go"
# argv = ["go", "version"]
# [[preflight.commands]]
# check_id = "github-auth"
# argv = ["gh", "auth", "status"]
# [preflight]
# required_environment = ["DIGITALOCEAN_ACCESS_TOKEN"]

[review]
enabled = false
max_review_attempts = 3
max_remediation_attempts = 2
max_total_tokens = 0
max_total_cost_microusd = 0
max_total_duration_ms = 0
allow_isolated_same_model_fallback = false
max_package_bytes = 1000000
max_package_tokens = 250000
max_evidence_bytes = 16000000
max_verification_log_bytes = 256000
# allowed_paths = ["src/", "tests/"]
# Prohibited changes are typed rules with stable ids. Each rule names exactly
# one of `path` (closed grammar: exact file, `dir/`, or `dir/**`) or `class`
# (dependency_manifest | dependency_lockfile | migration | configuration |
# test | generated_artifact). Optional `change_kinds` restricts the rule to
# specific Git change kinds; empty means all. The only accepted legacy string
# forms are a repository-relative path containing '/' or '.', or the exact
# phrase "dependency changes".
# [[review.prohibited_changes]]
# id = "no_secret_changes"
# path = "secrets/"
# description = "secret material is never agent-editable"
# [[review.prohibited_changes]]
# id = "no_dependency_manifest_changes"
# class = "dependency_manifest"

# Deterministic coding-agent selection. When this section is absent both the
# implementation and reviewer agents resolve to the Codex adapter with
# executable "codex" — exactly the historical behavior — and no review
# consistency checking applies. When present, validation is fail-closed and,
# with review enabled, review.*_agent.adapter_id must equal agents.*.adapter.
# [agents.implementation]
# adapter = "claude-code"          # "codex" | "claude-code"; default "codex"
# executable = "claude"            # default: "codex" for codex, "claude" for claude-code
# model = "sonnet"                 # optional; omitted -> CLI default
# effort = "high"                  # optional; claude-code only: "low" | "medium" | "high"
# permission_mode = "acceptEdits"  # optional; claude-code only:
#                                  # "default" | "plan" | "acceptEdits" | "bypassPermissions"
# max_execution_cost_microusd = 0  # optional; Claude Code enforces this natively
# max_execution_tokens = 0         # optional; refused unless the adapter supports it
# max_execution_duration_ms = 0    # optional; refused unless the adapter supports it
# extra_args = []                  # optional; validated passthrough
# [agents.reviewer]
# adapter = "claude-code"
# executable = "claude"
# model = "sonnet"
# effort = "high"
# permission_mode = "default"      # bypassPermissions is always rejected here

# Adapter-neutral worker registry. This is mutually exclusive with [agents].
# Automatic routing uses lowest estimated cost, then worker id. A stage pin is
# exact and is refused if unavailable, incapable, over budget, under-context,
# insufficiently isolated, or (for review) not independent.
# [worker_registry.routing]
# implementation_pin = "codex-primary"
# review_pin = "claude-review"
# max_stage_cost_microusd = 0
# required_context_tokens = 0
# [worker_registry.workers.codex-primary]
# runtime = "codex" # execution mechanism; legacy `adapter` migrates deterministically
# provider = "openai"
# model = "runtime-selected" # known id, "unknown", or "runtime-selected"
# auth_profile = "codex-chatgpt" # external descriptor key; never a credential
# capability_profile = "agentic-implementer"
# capabilities = ["planning", "implementation", "remediation", "narrow-task"]
# fresh_process_isolation = true
# context_tokens = 200000
# estimated_cost_microusd = 0
# available = true
# [worker_registry.workers.claude-review]
# adapter = "claude-code"
# provider = "anthropic"
# model = "sonnet"
# capabilities = ["review"]
# fresh_process_isolation = true
# context_tokens = 200000
# estimated_cost_microusd = 0
# available = true
# Ollama uses adapter = "ollama" and model = "qwen3:8b"; Familiar invokes it
# through the existing Codex OSS adapter path.

[review.scope]
allow_prd_expected_file_expansion = false
declaration_mode = "expected_or_configured"
# [[review.scope.classification]]
# id = "storage_migrations"
# class = "migration"
# path = "crates/familiar-ai-storage/migrations/"

[review.scope.file_classes]
dependency_manifest = "human_review"
dependency_lockfile = "human_review"
migration = "human_review"
configuration = "human_review"
test = "allow_when_expected"
generated_artifact = "human_review"
# [[review.verification]]
# check_id = "tests"
# argv = ["cargo", "test"]
# working_directory = "."
# timeout_ms = 300000
# required = true
# path_prefixes = ["crates/"]
# environment = { PATH = "/usr/local/bin:/usr/bin:/bin" }
# [review.implementation_agent]
# adapter_id = "codex-cli"
# agent_id = "implementation"
# provider = "openai"
# model = "configured-model"

# Optional deterministic cost tiers. When omitted or unmatched, full review is
# used. Rules are evaluated in authored order against measured diff evidence.
# Unknown, ambiguous, and high-risk footprints always use full review.
# [review.tier_policy]
# independent_review_required = false
# [review.tier_policy.standard_reviewer_agent]
# adapter_id = "codex-cli"
# agent_id = "economy-reviewer"
# provider = "openai"
# model = "configured-cheaper-model"
# [[review.tier_policy.rules]]
# id = "small-tests"
# tier = "checks-only" # "checks-only" | "standard" | "full"
# path_prefixes = ["tests/"]
# max_changed_files = 2
# max_changed_bytes = 4096
# change_kinds = ["added", "modified"]
# scope_classes = ["test"]
# [review.reviewer_agent]
# adapter_id = "codex-cli"
# agent_id = "reviewer"
# provider = "openai"
# model = "configured-model"

[watcher]
# enabled = true
# paths = []                                    # Directories to watch (e.g. ["~/Projects"])
# debounce_ms = 1000
# ignore_patterns = ["target/**", "node_modules/**"]
# respect_gitignore = true

[tray]
# enabled = true
# recent_projects_count = 5

[summary]
# enabled = true
# staleness_threshold_secs = 86400      # forced refresh window (24h)
# flush_interval_secs = 3
# max_file_size_bytes = 1048576         # 1 MB
# max_pending_files = 10000
# per_file_quiet_ms = 1500              # debounce per path before regen

[rollup]
# enabled = true
# default_limit = 20
# max_rollup_tokens = 4000
# max_rollup_chars = 50000

[dashboard]
# enabled = false                     # opt-in: set true to start localhost dashboard
# bind_address = "127.0.0.1:9400"

[packer]
# default_profile = "balanced"        # Options: minimal, balanced, aggressive, max_accuracy
# hard_ceiling_tokens = 15000

[inference.text]
# mode = "disabled"             # Options: disabled, local_only, remote_only, hybrid
# provider = "disabled"         # Options: disabled, builtin, remote
# builtin_model = "qwen2.5:3b"
