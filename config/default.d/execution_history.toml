# [execution_history.pricing]; without pricing configured every run's cost is
# unknown and a cost ceiling ends the session after the first attempt
# (unknown is never treated as zero).
# Optional versioned schedules live at
# [execution_history.price_schedules."schedule-id"] and declare effective_at,
# currency = "USD", calculation_version, and per-model nanoUSD rates. Operator
# subscription declarations are separate availability/fee facts under
# [execution_history.subscriptions."provider/model"] and never imply spend.
#
# Anthropic API-key ("local-estimate") billing mode (PRD-059): the raw
# Anthropic adapter never assumes Claude Code subscription economics — this
# schedule is what turns its usage observations into a local nanoUSD
# estimate, reconcilable against PRD-052 organization cost collection where
# an Admin-key billing source is configured for the same organization.
# Sourced from platform.claude.com/docs/en/pricing (cached 2026-06-24); a
# changed price is a new schedule id, this one is never edited in place.
# Cache-write uses the 5-minute-TTL multiplier (1.25x input); cache-read is
# 0.1x input, matching the categories this adapter reports distinctly.
# [execution_history.price_schedules.anthropic-api-2026-06-24]
# effective_at = "2026-06-24T00:00:00Z"
# currency = "USD"
# calculation_version = "anthropic-sticker-v1"
