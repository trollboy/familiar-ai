[package]
name = "familiar-ai-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
familiar-ai-llm = { path = "../familiar-ai-llm" }
async-trait.workspace = true
serde_json.workspace = true
libc.workspace = true
ring.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt"] }

# Review isolation is enforced by the kernel's Landlock API on Linux; other
# platforms use their own mechanism (macOS sandbox-exec) or fail closed.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
wiremock.workspace = true
