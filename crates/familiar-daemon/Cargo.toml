[package]
name = "familiar-daemon"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "familiar-daemon"
path = "src/main.rs"

[features]
default = ["tray"]
tray = ["dep:familiar-tray"]

[dependencies]
familiar-core = { path = "../familiar-core" }
familiar-logging = { path = "../familiar-logging" }
familiar-storage = { path = "../familiar-storage" }
familiar-summary = { path = "../familiar-summary" }
familiar-llm = { path = "../familiar-llm" }
familiar-watcher = { path = "../familiar-watcher" }
familiar-tray = { path = "../familiar-tray", optional = true }
ignore.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
libc.workspace = true
chrono.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true

[dev-dependencies]
familiar-testutil = { path = "../familiar-testutil" }
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
nix = { version = "0.29", features = ["signal"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
