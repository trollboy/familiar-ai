[package]
name = "familiar-tray"
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.78"

[dependencies]
familiar-core = { path = "../familiar-core" }
familiar-storage = { path = "../familiar-storage" }
tray-icon = "0.22"
muda = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
opener = "0.7"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
