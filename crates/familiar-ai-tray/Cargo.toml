[package]
name = "familiar-ai-tray"
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.78"

[features]
default = []
# Enabled transitively by familiar-ai-daemon's `tray` feature. Distinguishes
# "someone actually wants the tray linked" from "this workspace member got
# compiled because cargo build/test --workspace touches every member" — see
# build.rs.
enforce-native-deps = []

[dependencies]
familiar-ai-core = { path = "../familiar-ai-core" }
familiar-ai-storage = { path = "../familiar-ai-storage" }
# libxdo (default-on in both crates) exists only to drive muda's predefined
# Copy/Cut/Paste/SelectAll items, which this menu never uses. Keeping it would
# make `-lxdo` — a system package — a hard link-time requirement of the default
# daemon build, so it is turned off here and the tray builds with GTK alone.
tray-icon = { version = "0.22", default-features = false }
muda = { version = "0.17", default-features = false, features = ["gtk"] }
image = { version = "0.25", default-features = false, features = ["png"] }
opener = "0.7"
tokio = { version = "1", features = ["sync", "rt"] }
serde_json = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
