[package]
name = "familiar-ai-tray"
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.78"

[dependencies]
familiar-ai-core = { path = "../familiar-ai-core" }
familiar-ai-storage = { path = "../familiar-ai-storage" }
# libxdo (default-on in both crates) exists only to drive muda's predefined
# Copy/Cut/Paste/SelectAll items, which this menu never uses. Keeping it would
# make `-lxdo` — a system package — a hard link-time requirement of the default
# daemon build. GTK is enabled only for Linux below; macOS uses muda's native
# menu implementation and must not resolve GTK at all.
tray-icon = { version = "0.22", default-features = false }
muda = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
opener = "0.7"
tokio = { version = "1", features = ["sync", "rt"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
muda = { version = "0.17", default-features = false, features = ["gtk"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDate", "NSRunLoop"] }

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
